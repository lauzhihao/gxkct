version: '3.8'

services:
  gxkct:
    # 镜像名称：gxkct.com:5000/gxkct-web:latest
    # 如无私有 Registry，改为本地构建：build: .
    image: ${DOCKER_REGISTRY}/gxkct-web:${DOCKER_IMAGE_TAG:-latest}

    container_name: gxkct-preview

    # 端口映射：容器 3000 -> 主机 3000（nginx 反向代理使用）
    ports:
      - "3000:3000"

    # 环境变量
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_ENVIRONMENT=${NEXT_PUBLIC_ENVIRONMENT:-preview}

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志驱动
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G
