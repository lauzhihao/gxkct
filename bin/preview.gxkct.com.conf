# preview.gxkct.com Nginx 配置
# 用法: 复制到 /etc/nginx/conf.d/ 目录，然后执行 nginx -t && nginx -s reload

# 代理缓存配置（放在 server 块外部）
proxy_cache_path /var/cache/nginx/preview levels=1:2 keys_zone=preview_cache:10m max_size=1g inactive=60m use_temp_path=off;

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend {
    server 127.0.0.1:38081;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.gxkct.com;

    # 日志配置
    access_log /var/log/nginx/preview.gxkct.com.access.log;
    error_log /var/log/nginx/preview.gxkct.com.error.log;

    # 客户端请求体大小限制（文件上传）
    client_max_body_size 50m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # SSE 接口专用配置（必须放在 / 之前）
    # ============================================
    location /api/chat/ {
        proxy_pass http://frontend;

        # SSE 必需：禁用所有缓冲
        proxy_buffering off;
        proxy_cache off;

        # SSE 必需：禁用 Nginx 层面的 chunked 编码干预
        chunked_transfer_encoding on;

        # SSE 必需：长连接超时（2小时）
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;

        # SSE 必需：保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 禁用 gzip（避免缓冲 SSE 流）
        gzip off;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告知上游禁用缓冲
        proxy_set_header X-Accel-Buffering no;
    }

    # ============================================
    # 后端 SSE 接口专用配置（必须放在 /college/ 之前）
    # /college/api/chat/ -> localhost:38081/api/chat/
    # ============================================
    location /college/api/chat/ {
        proxy_pass http://backend/api/chat/;
        proxy_http_version 1.1;

        # SSE 必需：禁用所有缓冲
        proxy_buffering off;
        proxy_cache off;

        # SSE 必需：禁用 Nginx 层面的 chunked 编码干预
        chunked_transfer_encoding on;

        # SSE 必需：长连接超时（2小时）
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;

        # SSE 必需：保持连接
        proxy_set_header Connection "";

        # 禁用 gzip（避免缓冲 SSE 流）
        gzip off;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告知上游禁用缓冲
        proxy_set_header X-Accel-Buffering no;
    }

    # ============================================
    # 后端 API（/college）
    # 去掉 /college 前缀：/college/api -> localhost:38081/api
    # ============================================
    location /college/api/v5/courses/ {
        proxy_pass http://backend/api/v5/courses/;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;

        gzip off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;
    }

    location /college/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================
    # Next.js 静态资源（带 hash，长期缓存）
    # ============================================
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 缓存1年（文件名带 hash，更新后自动失效）
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 允许 gzip
        gzip_static on;
    }

    # ============================================
    # 公共静态资源（图片、字体等）
    # ============================================
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 缓存7天
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================
    # 前端主路由
    # ============================================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 启用代理缓冲，加速响应
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        # HTML 页面不缓存，确保更新后立即生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
